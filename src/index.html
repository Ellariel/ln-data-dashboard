<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <h1>Lightning Network topology analysis</h1>
    <h4><a
        href="https://github.com/ellariel/ln-data-dashboard?tab=readme-ov-file#lightning-network-topology-data-dashboard">README</a>
    </h4>
    <div class="header-controls">
      <select id="layout-select">
        <option value="auto">Auto Grid</option>
        <option value="single">Single Column</option>
        <option value="2x2">2×2 Grid</option>
        <option value="3x3">3×3 Grid</option>
      </select>
      <button id="add-figure-btn">Add Figure</button>
    </div>
  </header>
  <main id="dashboard" class="layout-auto"></main>

  <!-- Modal container -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="modal-close">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
